# Nginx — substitua SEU_DOMINIO ou use só o IP
# sudo cp deploy/nginx-opto.conf /etc/nginx/sites-available/opto
# sudo ln -sf /etc/nginx/sites-available/opto /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (com domínio apontando pro VPS):
# sudo apt install certbot python3-certbot-nginx -y
# sudo certbot --nginx -d SEU_DOMINIO

server {
    listen 80;
    server_name SEU_DOMINIO _;

    client_max_body_size 160M;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# Nginx — substitua SEU_DOMINIO ou use só o IP
# sudo cp deploy/nginx-opto.conf /etc/nginx/sites-available/opto
# sudo ln -sf /etc/nginx/sites-available/opto /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (obrigatório em produção):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d SEU_DOMINIO
#   sudo cp deploy/nginx-opto-ssl.conf /etc/nginx/sites-available/opto
#   # ajuste ssl_certificate se o certbot usou outro path
#   sudo nginx -t && sudo systemctl reload nginx
#
# Logs: $uri (sem querystring) — tickets/JWT não vão para o access.log.

limit_req_zone $binary_remote_addr zone=opto_auth:10m rate=5r/m;

log_format opto_noleak '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

upstream opto_backend {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    server_name SEU_DOMINIO _;

    access_log /var/log/nginx/opto.access.log opto_noleak;
    error_log  /var/log/nginx/opto.error.log;

    client_max_body_size 160M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Com certificado ativo, descomente o redirect e use nginx-opto-ssl.conf:
    # return 301 https://$host$request_uri;

    location /api/auth/ {
        limit_req zone=opto_auth burst=3 nodelay;
        proxy_pass http://opto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://opto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

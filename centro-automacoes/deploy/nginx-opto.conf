# Nginx — substitua SEU_DOMINIO ou use só o IP
# sudo cp deploy/nginx-opto.conf /etc/nginx/sites-available/opto
# sudo ln -sf /etc/nginx/sites-available/opto /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (com domínio apontando pro VPS):
# sudo apt install certbot python3-certbot-nginx -y
# sudo certbot --nginx -d SEU_DOMINIO
#
# Após certbot, descomente o bloco HTTPS abaixo e ajuste ssl_certificate paths.

limit_req_zone $binary_remote_addr zone=opto_auth:10m rate=5r/m;

upstream opto_backend {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    server_name SEU_DOMINIO _;

    client_max_body_size 160M;

    # Redirecione para HTTPS quando o certificado estiver ativo:
    # return 301 https://$host$request_uri;

    location /api/auth/ {
        limit_req zone=opto_auth burst=3 nodelay;
        proxy_pass http://opto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://opto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}


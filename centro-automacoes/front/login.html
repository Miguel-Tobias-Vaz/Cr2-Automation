<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Opto Automações</title>
    <link rel="icon" type="image/png" href="/assets/OPTO%20-%20Azul.png" />
    <link rel="stylesheet" href="/assets/styles.css?v=home72" />
  </head>
  <body class="login-page">
    <div class="noise" aria-hidden="true"></div>
    <main class="login-card">
      <img class="brand-icon" src="/assets/OPTO%20-%20Azul.png" alt="" width="48" height="48" />
      <h1>Opto Automações</h1>
      <p class="login-lede" id="login-lede">Entre para usar o painel.</p>
      <form id="login-form" class="login-form">
        <label id="login-user-label">
          <span id="login-user-caption">Usuário</span>
          <input type="text" id="login-user" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input type="password" id="login-pass" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error" hidden></p>
        <button type="submit" class="btn btn-primary" id="login-btn">Entrar</button>
      </form>
      <p class="login-hint admin-muted" id="login-hint">
        Sem login configurado? O painel abre direto (modo aberto).
      </p>
    </main>
    <script src="/assets/supabase-config.js?v=1" onerror="void 0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/assets/shared.js?v=home72"></script>
    <script type="module">
      import { whenReady } from "/assets/modules/core.js?v=home72";
      whenReady(() => {
(function () {
        const params = new URLSearchParams(location.search);
        const next = params.get("next") || "/";
        const form = document.getElementById("login-form");
        const err = document.getElementById("login-error");
        const userInput = document.getElementById("login-user");
        const userCaption = document.getElementById("login-user-caption");
        const lede = document.getElementById("login-lede");
        const hint = document.getElementById("login-hint");

        let authMode = "off";
        let supabaseClient = null;

        async function loadAuthConfig() {
          try {
            const r = await fetch("/api/auth/config");
            if (r.ok) {
              const cfg = await r.json();
              if (cfg.mode && cfg.mode !== "off") return cfg;
              if (!cfg.auth_required) return cfg;
            }
          } catch (_) {}
          if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
            return {
              mode: "supabase",
              auth_required: true,
              supabase_url: window.SUPABASE_URL,
              supabase_anon_key: window.SUPABASE_ANON_KEY,
            };
          }
          return { mode: "off", auth_required: false };
        }

        function applyMode(cfg) {
          authMode = cfg.mode || "off";
          if (authMode === "supabase") {
            userCaption.textContent = "E-mail";
            userInput.type = "email";
            userInput.autocomplete = "email";
            lede.textContent = "Entre com seu e-mail.";
            hint.textContent = "Conta Supabase Auth.";
            if (window.supabase && cfg.supabase_url && cfg.supabase_anon_key) {
              supabaseClient = window.supabase.createClient(
                cfg.supabase_url,
                cfg.supabase_anon_key,
                {
                  auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: false,
                    storage: window.localStorage,
                  },
                }
              );
            }
          } else if (authMode === "local") {
            lede.textContent = "Entre com usuário e senha.";
            hint.textContent = "Usuários definidos em OPTO_USERS (opto.env).";
          } else {
            hint.textContent = "Login não configurado — o painel funciona sem autenticação.";
          }
        }

        function saveSessionTokens(session) {
          if (!session || !session.access_token) return;
          if (window.OptoAutomacoes && OptoAutomacoes.setAuthToken) {
            OptoAutomacoes.setAuthToken(session.access_token);
          }
          try {
            if (session.refresh_token) {
              localStorage.setItem("opto-auth-refresh", session.refresh_token);
            }
          } catch (_) {}
        }

        async function loginSupabase(email, password) {
          if (!supabaseClient) throw new Error("Supabase não configurado.");
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });
          if (error) throw new Error(error.message || "Falha no login");
          if (!data.session?.access_token) throw new Error("Sessão inválida");
          saveSessionTokens(data.session);
          location.href = next;
        }

        async function loginLocal(username, password) {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            throw new Error(
              (typeof data.detail === "string" && data.detail) ||
                data.detail ||
                "Usuário ou senha inválidos"
            );
          }
          if (window.OptoAutomacoes && OptoAutomacoes.setAuthToken) {
            OptoAutomacoes.setAuthToken(data.token);
          }
          location.href = next;
        }

        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          err.hidden = true;
          const btn = document.getElementById("login-btn");
          btn.disabled = true;
          const ident = userInput.value.trim();
          const pass = document.getElementById("login-pass").value;
          try {
            if (authMode === "supabase") await loginSupabase(ident, pass);
            else if (authMode === "local") await loginLocal(ident, pass);
            else location.href = next;
          } catch (e) {
            err.textContent = e.message || "Erro ao entrar";
            err.hidden = false;
            btn.disabled = false;
          }
        });

        loadAuthConfig()
          .then(async (cfg) => {
            applyMode(cfg);
            const meFetch =
              window.OptoAutomacoes && OptoAutomacoes.authFetch
                ? OptoAutomacoes.authFetch
                : fetch;
            return meFetch("/api/auth/me")
              .then((r) => r.json())
              .then((d) => {
                if (!d.auth_required) location.href = next;
                else if (d.user) location.href = next;
              });
          })
          .catch(() => {});
      })();
      });
    </script>
  </body>
</html>

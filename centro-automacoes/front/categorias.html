<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baixar por Categoria — Opto Automações</title>
    <link rel="icon" type="image/png" href="/assets/brand-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css?v=home64" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>

    <header class="top">
      <a class="brand-mark" href="/">
        <img class="brand-icon" src="/assets/brand-icon.png" alt="" width="28" height="28" />
        <span>Opto Automações</span>
      </a>
      <nav class="nav" id="site-nav"></nav>
      <span class="api-pill" id="api-pill">Servidor …</span>
    </header>

    <main class="page-shell">
      <section class="hero page-hero">
        <div class="hero-plane" aria-hidden="true"><div class="hero-grid"></div></div>
        <div class="hero-main">
          <header class="hero-copy">
            <h1>Baixar por Categoria</h1>
            <p class="lede">
              Varre a listagem WordPress (com paginação), abre cada post e baixa
              todos os PDFs do corpo do artigo.
            </p>
          </header>
          <article class="stream is-in">
            <span class="stream-index">02</span>
            <h3>Campos</h3>
            <ul>
              <li>Domínio do site</li>
              <li>URL da categoria (com / no final)</li>
              <li>Pasta de destino</li>
            </ul>
          </article>
        </div>
      </section>

      <section class="painel">
        <header class="section-head"><h2>Painel</h2></header>
        <form class="painel-form" id="form-categorias">
          <fieldset class="bloco">
            <legend>WordPress</legend>
            <label class="field">
              <span class="field-label"><em>Site (domínio) *</em></span>
              <input type="url" id="site" placeholder="https://camaraparagominas.pa.gov.br" required />
            </label>
            <label class="field">
              <span class="field-label"><em>URL da categoria *</em></span>
              <input type="url" id="url_categoria" placeholder="https://.../portal-da-transparencia/legislacao/" required />
            </label>
            <label class="field">
              <span class="field-label"><em>Pasta base</em></span>
              <input type="text" id="pasta_base" value="C:\Downloads" />
            </label>
            <label class="field">
              <span class="field-label"><em>Anos a baixar</em></span>
              <input type="text" id="anos" placeholder="Ex.: 2023  ·  2023,2024  ·  vazio = todos" />
              <small class="field-hint" style="display:block;margin-top:0.25rem;color:var(--mist)">
                Um ano (<code>2023</code>), vários (<code>2022,2023,2024</code>) ou vazio para todos.
              </small>
            </label>
            <label class="check-row" for="ler_pdf">
              <input type="checkbox" id="ler_pdf" checked />
              <span class="check-copy">
                <strong>Ler texto do PDF para nomear</strong>
                <small>Ex.: Lei Nº738-2023.pdf</small>
              </span>
            </label>
            <label class="check-row" for="refinar_ia">
              <input type="checkbox" id="refinar_ia" checked />
              <span class="check-copy">
                <strong>Refinar nome com IA local (Ollama)</strong>
                <small>Corrige tipo/número/ano quando as regras falham.</small>
              </span>
            </label>
            <label class="field">
              <span class="field-label"><em>Modelo Ollama (opcional)</em></span>
              <input type="text" id="modelo_ia" value="llama3.2:3b" placeholder="llama3.2:3b" />
            </label>
          </fieldset>
          <div class="acao-row">
            <button type="submit" class="btn btn-primary" id="btn-run">Iniciar baixa</button>
            <button type="button" class="btn btn-stop" id="btn-cancel" hidden title="Interrompe a fila deste processo">Cancelar fila</button>
            <a class="btn btn-ghost" href="#log">Ver log</a>
          </div>
        </form>
      </section>

      <section class="log-wrap" id="log">
        <header class="section-head">
          <h2>Log</h2>
          <p>Situação: <strong id="log-state">Parado</strong></p>
        </header>
        <div class="log-console" id="log-console"></div>
      </section>
    </main>

    <script src="/assets/fluid-particles.js?v=home57"></script>
    <script type="module" src="/assets/shared.js?v=home64"></script>
    <script>
document.addEventListener("opto-ready", () => {
CR2Centro.injectNav("categorias");
      CR2Centro.pingApi();
      CR2Centro.bindRun(
        "categorias",
        "form-categorias",
        ["site", "url_categoria", "pasta_base", "anos", "ler_pdf", "refinar_ia", "modelo_ia"],
        () => ({
        site: document.getElementById("site").value.trim(),
        url_categoria: document.getElementById("url_categoria").value.trim(),
        pasta_base: document.getElementById("pasta_base").value.trim(),
        anos: document.getElementById("anos").value.trim(),
        ler_pdf: document.getElementById("ler_pdf").checked,
        refinar_ia: document.getElementById("refinar_ia").checked,
        modelo_ia: document.getElementById("modelo_ia").value.trim() || "llama3.2:3b",
      }), false);
});
</script></body>
</html>

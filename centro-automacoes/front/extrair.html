<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extração  Opto Automações</title>
    <link rel="icon" type="image/png" href="/assets/brand-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css?v=home71" />
  </head>
  <body class="theme-bw hub-page">
    <div class="noise" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>

    <header class="top">
      <a class="brand-mark" href="/">
        <img class="brand-icon" src="/assets/brand-icon.png" alt="" width="28" height="28" />
        <span>Opto Automações</span>
      </a>
      <nav class="nav" id="site-nav"></nav>
      <span class="api-pill" id="api-pill"></span>
    </header>

    <main class="page-shell">
      <section class="hero page-hero hub-hero" aria-label="Extração">
        <div class="hero-plane" aria-hidden="true"></div>
        <div class="hero-main">
          <header class="hero-copy hub-brand">
            <p class="hub-kicker"><a href="/">Início</a> · Extração</p>
            <h1 id="hub-title">Extração</h1>
            <p class="lede hub-tagline" id="hub-lede">
              Baixas do portal: documentos, categorias, Extração Pro, licitações CR2, TCM-PA e repasses.
            </p>
          </header>
          <div class="hub-grid" id="hub-grid"></div>
        </div>
      </section>
    </main>

    <script src="/assets/fluid-particles.js?v=home71"></script>
    <script type="module" src="/assets/shared.js?v=home71"></script>
    <script type="module">
      import { whenReady } from "/assets/modules/core.js?v=home71";
      whenReady(() => {
        requestAnimationFrame(() => {
          const grid = document.getElementById("hub-grid");
          if (!grid || grid.querySelector('a[href="/tcm-licitacoes.html"]')) return;
          grid.insertAdjacentHTML(
            "beforeend",
            `<a class="hub-card" href="/tcm-licitacoes.html" data-glow>
              <span class="hub-card-glow" data-glow aria-hidden="true"></span>
              <span class="hub-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z"/><path d="M3 10h18"/><path d="M3 15h18"/><path d="M9 5v14"/><path d="M15 5v14"/></svg></span>
              <h3>Licitações TCM-PA</h3>
              <p>Mural do TCM-PA: documentos, contratos e planilha Excel.</p>
              <div class="hub-card-foot"><span>Abrir</span><span aria-hidden="true">→</span></div>
            </a>`
          );
          window.OptoAutomacoes?.enableSpotlightCards?.();
        });
      });
    </script>
  </body>
</html>
